name: GitHub Actions Demo PZ
on:
  push:
    branches: [main]
    paths-ignore: [.github/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 6 * * 0'
  workflow_dispatch: 
    inputs:
      environments:
        description: 'Env to deploy to'
        type: environment
        required: true
jobs:
  Build:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo "The job was triggered by event ${{ github.event_name }}"
          echo "The name of this branch is ${{ github.ref }} and your repo is ${{ github.repository }}."
      - uses: actions/checkout@v4
      - name: List files in repo
        run: |
          echo "Repo ${{ github.repository }} contains the following files:"
          tree
  Test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: Build
    environment: Test
    steps:
      - run: echo "🧪 Testing..."

  Load-Test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: Build
    environment: Load-Test
    steps:
      - run: |
          echo "🧪 Testing..."
          sleep 15

  Production:
    runs-on: ubuntu-latest
    needs: [Test, Load-Test]
    environment:
      name: Production
      url: https://writeabout.net
    if: ${{ inputs.environments == 'Production' }}
    steps:
      - run: |
          echo "🚀 Step 1..."
          sleep 10
      - run: |
          echo "🚀 Step 2..."
          sleep 10
      - run: |
          echo "🚀 Step 3..."
          sleep 10
      - run: |
          echo "🚀 Step 4..."
          sleep 10
      - run: |
          echo "🚀 Step 5..."
          sleep 10
          
      
      
